services:
  postgres:
    image: postgres:16-alpine
    container_name: decolonia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: decolonia
      POSTGRES_PASSWORD: decolonia
      POSTGRES_DB: decolonia_office
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decolonia -d decolonia_office"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
