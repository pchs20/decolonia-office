services:
  postgres:
    image: postgres:16-alpine
    container_name: decolonia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: decolonia
      POSTGRES_PASSWORD: decolonia
      POSTGRES_DB: decolonia_office
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decolonia -d decolonia_office"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: decolonia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: decolonia-minio-bootstrap
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/decolonia-documents;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
